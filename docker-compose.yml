name: hwf-code-rag

services:
  db:
    build: ./db
    image: hwf-code-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  rag:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      REPOS_DIR: /data/repos
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
      FASTEMBED_CACHE_PATH: /opt/fastembed
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
      - repos:/data/repos
    ports:
      - "8080:8080"
    entrypoint: ["python", "-m", "rag"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped

volumes:
  pgdata:
  repos:
