<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code RAG</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --ink: #1c1915;
      --muted: #5e574c;
      --line: #ddd4c4;
      --paper: #fffdf8;
      --accent: #1f4d3a;
      --accent-ink: #f4f7f2;
      --warn: #8a3b12;
      --code: #14201b;
      --code-ink: #e7ecdf;
      --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", "Helvetica Neue", sans-serif;
    }
    main {
      width: min(980px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
    }
    h1 { font-size: 1.8rem; font-weight: 650; letter-spacing: -0.03em; margin: 0; }
    .eyebrow { margin: 0 0 0.2rem; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .chip {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
      max-width: 22rem;
    }
    .bar, .ask, .index-form, .result, .group {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .bar, .ask, .index-form { margin-top: 1rem; padding: 1rem; }
    .bar { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; }
    label { display: grid; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); }
    label.grow { flex: 1 1 16rem; }
    select, input[type="text"], input[type="number"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      font: inherit;
    }
    textarea { min-height: 7rem; resize: vertical; }
    ::placeholder { color: #8a8174; }
    button, .modes button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }
    button.secondary, .modes button { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .modes { display: flex; gap: 0.4rem; margin-top: 1rem; }
    .modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .row { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; margin-top: 0.75rem; }
    .check { display: flex; align-items: center; gap: 0.4rem; }
    .index-form { display: grid; gap: 0.75rem; }
    .index-form[hidden] { display: none; }
    pre.log, pre.code {
      margin: 0;
      white-space: pre-wrap;
      overflow: auto;
      font: 0.86rem/1.45 ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    }
    pre.log { max-height: 12rem; background: #f7f3ea; border-radius: 8px; padding: 0.7rem; }
    .meter { height: 0.6rem; background: #e4dccb; border-radius: 999px; overflow: hidden; }
    .meter > div { height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
    .meter.indeterminate > div { width: 40%; animation: meter-slide 1.1s ease-in-out infinite; }
    @keyframes meter-slide {
      from { transform: translateX(-120%); }
      to { transform: translateX(280%); }
    }
    #index-meter-label { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.9rem; }
    #status { min-height: 1.5rem; margin: 0.8rem 0; color: var(--muted); }
    #status.error { color: var(--warn); }
    .scope { color: var(--muted); margin: 0 0 0.8rem; }
    .answer {
      background: #f7f1e4;
      border-left: 4px solid var(--accent);
      padding: 0.9rem 1rem;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-bottom: 1rem;
    }
    .group { margin-top: 0.8rem; padding: 0.4rem 0.9rem 0.9rem; }
    .group h2 { font-size: 1rem; margin: 0.7rem 0; }
    article { border-top: 1px solid var(--line); padding-top: 0.8rem; margin-top: 0.8rem; }
    article header { display: block; border: 0; padding: 0; }
    .path { font-weight: 650; }
    .path a { color: var(--accent); text-underline-offset: 0.18em; }
    .path a:hover { color: #143528; }
    .symbol, .meta { color: var(--muted); font-size: 0.85rem; }
    pre.code {
      margin-top: 0.55rem;
      max-height: 22rem;
      background: var(--code);
      color: var(--code-ink);
      border-radius: 8px;
      padding: 0.8rem;
    }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Code RAG</p>
        <h1>Ask a repository</h1>
      </div>
      <div class="chip" id="model-chip">Checking the language model…</div>
    </header>

    <section class="bar">
      <label class="grow">Repository
        <select id="repo"></select>
      </label>
      <button class="secondary" type="button" id="index-toggle">Index a repository</button>
    </section>

    <form class="index-form" id="index-form" hidden>
      <label>GitHub repository
        <input id="index-repo" type="text" placeholder="https://github.com/hmcts/hwf-publicapp" autocomplete="off">
      </label>
      <div class="row">
        <label class="grow">Branch
          <input id="index-branch" type="text" placeholder="optional">
        </label>
        <label class="check"><input id="index-force" type="checkbox"> Rebuild this commit</label>
        <button type="submit" id="index-go">Index</button>
      </div>
      <div id="index-meter" hidden>
        <div class="meter" id="index-meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Indexing progress">
          <div id="index-meter-fill"></div>
        </div>
        <p id="index-meter-label"></p>
      </div>
      <pre class="log" id="index-log" hidden></pre>
    </form>

    <nav class="modes" aria-label="Task">
      <button type="button" data-mode="query" aria-pressed="true">Query</button>
      <button type="button" data-mode="impact" aria-pressed="false">Impact</button>
      <button type="button" data-mode="search" aria-pressed="false">Search</button>
    </nav>

    <form class="ask" id="ask">
      <label id="prompt-label"><span id="prompt-caption">Question</span>
        <textarea id="prompt" placeholder="Where is the online application stored?"></textarea>
      </label>
      <div class="row">
        <label id="k-wrap">Passages
          <input id="k" type="number" min="1" max="30" value="8">
        </label>
        <label class="check" id="answer-wrap"><input id="answer" type="checkbox" checked> Written answer</label>
        <button type="submit" id="go">Ask</button>
      </div>
    </form>

    <p id="status" role="status"></p>
    <section id="results"></section>
  </main>
  <script>
    const modes = {
      query: { label: "Question", placeholder: "Where is the online application stored?", button: "Ask", answer: true, k: true },
      impact: { label: "Class, method, or file", placeholder: "ApplicationController#online_application", button: "Analyse", answer: true, k: false },
      search: { label: "Search", placeholder: "calculation_scheme", button: "Search", answer: false, k: true }
    };
    const prompts = { query: "", impact: "", search: "" };
    let mode = "query";
    let poll = null;
    let branchTimer = null;
    let branchLookup = 0;

    const repoSelect = document.querySelector("#repo");
    const prompt = document.querySelector("#prompt");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");

    document.querySelectorAll(".modes button").forEach((button) => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });
    document.querySelector("#ask").addEventListener("submit", onAsk);
    document.querySelector("#index-form").addEventListener("submit", onIndex);
    document.querySelector("#index-repo").addEventListener("input", () => {
      clearTimeout(branchTimer);
      branchTimer = setTimeout(refreshDefaultBranch, 400);
    });
    document.querySelector("#index-toggle").addEventListener("click", () => {
      document.querySelector("#index-form").hidden = !document.querySelector("#index-form").hidden;
    });
    prompt.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        document.querySelector("#ask").requestSubmit();
      }
    });

    function setMode(next) {
      prompts[mode] = prompt.value;
      mode = next;
      prompt.value = prompts[next] || "";
      const spec = modes[next];
      document.querySelector("#prompt-caption").textContent = spec.label;
      prompt.placeholder = spec.placeholder;
      prompt.style.minHeight = next === "query" ? "7rem" : "3.2rem";
      document.querySelector("#go").textContent = spec.button;
      document.querySelector("#k-wrap").hidden = !spec.k;
      document.querySelector("#answer-wrap").hidden = !spec.answer;
      document.querySelectorAll(".modes button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === next));
      });
      results.replaceChildren();
      setStatus("");
    }

    async function refresh() {
      const response = await fetch("/api/status");
      const body = await response.json();
      if (!response.ok) {
        setStatus(body.error || "The index is unavailable", true);
        return body;
      }
      const previous = repoSelect.value;
      repoSelect.replaceChildren();
      const all = document.createElement("option");
      all.value = "";
      all.textContent = body.repositories.length ? "All indexed repositories" : "No repositories indexed yet";
      repoSelect.append(all);
      for (const repo of body.repositories) {
        const option = document.createElement("option");
        option.value = repo.name;
        option.textContent = `${repo.name} · ${repo.branch} · ${repo.commit_sha} · ${repo.chunks} chunks`;
        repoSelect.append(option);
      }
      if ([...repoSelect.options].some((option) => option.value === previous)) repoSelect.value = previous;
      const model = body.model;
      const retrieval = model.retrieval && model.retrieval !== model.name ? ` · search ${model.retrieval}` : "";
      document.querySelector("#model-chip").textContent = model.configured
        ? `${model.provider} · ${model.name}${retrieval}`
        : "Retrieved code only";
      document.querySelector("#answer").disabled = !model.configured;
      if (!model.configured) document.querySelector("#answer").checked = false;
      showIngest(body.ingest);
      return body;
    }

    function showIngest(ingest) {
      const log = document.querySelector("#index-log");
      const meter = document.querySelector("#index-meter");
      const button = document.querySelector("#index-go");
      button.disabled = Boolean(ingest && ingest.running);
      button.textContent = ingest && ingest.running ? "Indexing…" : "Index";
      const active = ingest && (ingest.running || ingest.log || ingest.error);
      if (!active) {
        meter.hidden = true;
        log.hidden = true;
        return;
      }
      document.querySelector("#index-form").hidden = false;
      const repoInput = document.querySelector("#index-repo");
      if (ingest.running && ingest.repo && !repoInput.value) {
        repoInput.value = ingest.repo;
        refreshDefaultBranch();
      }
      paintMeter(ingest);
      log.hidden = !(ingest.log || ingest.error);
      log.textContent = [ingest.error, ingest.log].filter(Boolean).join("\n");
      if (!log.hidden) log.scrollTop = log.scrollHeight;
      if (ingest.running && !poll) poll = setInterval(pollIngest, 1000);
      if (!ingest.running && poll) {
        clearInterval(poll);
        poll = null;
      }
    }

    function paintMeter(ingest) {
      const meter = document.querySelector("#index-meter");
      const track = document.querySelector("#index-meter-track");
      const fill = document.querySelector("#index-meter-fill");
      const label = document.querySelector("#index-meter-label");
      if (!ingest.running) {
        meter.hidden = true;
        return;
      }
      meter.hidden = false;
      const progress = ingest.progress;
      label.textContent = (progress && progress.label) || "Indexing…";
      if (!progress || progress.percent == null) {
        track.classList.add("indeterminate");
        track.removeAttribute("aria-valuenow");
        fill.style.width = "";
        return;
      }
      track.classList.remove("indeterminate");
      track.setAttribute("aria-valuenow", String(progress.percent));
      fill.style.transform = "none";
      fill.style.width = `${progress.percent}%`;
    }

    async function pollIngest() {
      const body = await refresh();
      if (body && body.ingest && !body.ingest.running && !body.ingest.error) {
        setStatus(body.ingest.repo ? `Indexed ${body.ingest.repo}` : "Index updated");
      }
    }

    async function refreshDefaultBranch() {
      const spec = document.querySelector("#index-repo").value.trim();
      const branchInput = document.querySelector("#index-branch");
      const requestId = ++branchLookup;
      if (!spec) {
        branchInput.placeholder = "optional";
        return;
      }
      const branch = await lookupDefaultBranch(spec);
      if (requestId !== branchLookup) return;
      branchInput.placeholder = branch ? `optional - default: ${branch}` : "optional";
    }

    async function lookupDefaultBranch(spec) {
      try {
        const response = await fetch(`/api/default-branch?repo=${encodeURIComponent(spec)}`);
        const body = await response.json();
        if (response.ok && body.branch) return body.branch;
        if (!body || body.error !== "Not found") return null;
      } catch (_error) {
        // The page can ask GitHub directly when this server has no lookup route yet.
      }
      const name = githubRepoName(spec);
      if (!name) return null;
      try {
        const response = await fetch(`https://api.github.com/repos/${name}`, {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!response.ok) return null;
        const body = await response.json();
        return body.default_branch || null;
      } catch (_error) {
        return null;
      }
    }

    function githubRepoName(spec) {
      const trimmed = spec.trim().replace(/\.git$/, "");
      const remote = trimmed.match(/github\.com[:/]([^/]+)\/([^/#?\s]+)/i);
      if (remote) return `${remote[1]}/${remote[2]}`;
      const short = trimmed.match(/^([^/\s]+)\/([^/\s]+)$/);
      return short ? `${short[1]}/${short[2]}` : null;
    }

    async function onIndex(event) {
      event.preventDefault();
      setStatus("Starting the index…");
      const response = await fetch("/api/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          repo: document.querySelector("#index-repo").value,
          branch: document.querySelector("#index-branch").value,
          force: document.querySelector("#index-force").checked
        })
      });
      const body = await response.json();
      if (!response.ok) {
        setStatus(body.error || "Could not start the index", true);
        return;
      }
      showIngest(body.ingest);
      if (!poll) poll = setInterval(pollIngest, 1000);
    }

    async function onAsk(event) {
      event.preventDefault();
      const requested = mode;
      const spec = modes[requested];
      const go = document.querySelector("#go");
      go.disabled = true;
      results.replaceChildren();
      setStatus(spec.answer && document.querySelector("#answer").checked ? "Searching and writing an answer…" : "Searching the index…");
      const payload = { repo: repoSelect.value };
      if (mode === "impact") payload.target = prompt.value;
      else {
        payload.question = prompt.value;
        payload.k = Number(document.querySelector("#k").value);
      }
      if (spec.answer) payload.answer = document.querySelector("#answer").checked;
      try {
        const response = await fetch(`/api/${mode}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await response.json();
        if (!response.ok) {
          setStatus(body.error || "The request failed", true);
          return;
        }
        render(body, requested);
        setStatus("");
      } catch (error) {
        setStatus("The request failed before a response arrived", true);
      } finally {
        go.disabled = false;
      }
    }

    function render(body, requested) {
      results.replaceChildren();
      if (body.repositories) {
        const scope = document.createElement("p");
        scope.className = "scope";
        scope.textContent = body.repositories.map((repo) => `${repo.name} @ ${repo.commit_sha} (${repo.branch})`).join(", ");
        results.append(scope);
      }
      if (body.answer_error) {
        const note = document.createElement("p");
        note.className = "answer";
        note.textContent = body.answer_error;
        results.append(note);
      } else if (body.answer) {
        const answer = document.createElement("div");
        answer.className = "answer";
        answer.textContent = body.answer;
        results.append(answer);
      }
      if (requested === "impact") {
        if (body.truncated) {
          const note = document.createElement("p");
          note.className = "scope";
          note.textContent = "This name appears in more chunks than are shown here.";
          results.append(note);
        }
        renderGroup("Definitions", body.definitions, body.definition_count);
        renderGroup("References", body.references, body.reference_count);
        renderGroup("Related", body.related, (body.related || []).length);
        return;
      }
      if (body.queries && body.queries.length > 1) {
        const searched = document.createElement("p");
        searched.className = "scope";
        searched.textContent = `Searched: ${body.queries.join(" · ")}`;
        results.append(searched);
      }
      if (!body.hits || !body.hits.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No matching code.";
        results.append(empty);
        return;
      }
      const group = document.createElement("div");
      group.className = "group";
      for (const hit of body.hits) group.append(hitArticle(hit, mode === "search"));
      results.append(group);
    }

    function renderGroup(title, hits, total) {
      const group = document.createElement("section");
      group.className = "group";
      const heading = document.createElement("h2");
      const shown = hits ? hits.length : 0;
      const extra = Math.max(0, (total || 0) - shown);
      heading.textContent = extra ? `${title} (${shown}, ${extra} more)` : `${title} (${shown})`;
      group.append(heading);
      if (!shown) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "None.";
        group.append(empty);
      } else {
        for (const hit of hits) group.append(hitArticle(hit, false));
      }
      results.append(group);
    }

    function hitArticle(hit, showScore) {
      const article = document.createElement("article");
      const heading = document.createElement("div");
      heading.className = "path";
      const label = `${hit.repo}  ${hit.path}:${hit.start_line}-${hit.end_line}`;
      if (hit.url) {
        const link = document.createElement("a");
        link.href = hit.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = label;
        heading.append(link);
      } else {
        heading.textContent = label;
      }
      article.append(heading);
      if (hit.symbol) {
        const symbol = document.createElement("div");
        symbol.className = "symbol";
        symbol.textContent = hit.symbol;
        article.append(symbol);
      }
      if (showScore) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `score ${Number(hit.score).toFixed(4)}`;
        article.append(meta);
      }
      const code = document.createElement("pre");
      code.className = "code";
      code.textContent = hit.content;
      article.append(code);
      return article;
    }

    function setStatus(message, isError) {
      status.textContent = message;
      status.className = isError ? "error" : "";
    }

    setMode("query");
    refresh().catch(() => setStatus("The index is unavailable", true));
  </script>
</body>
</html>
